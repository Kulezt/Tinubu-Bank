<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Tinubu Bank</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="login-media.css">
    
</head>

<body>
    <main>
        <section class="login-section">
            <div class="container">
                <div class="left login-left">
                    <img src="./images/login img.jpeg" alt="" class="left-img">

                </div>
                <div class="right login-right">
                    <form action="" class="login-form" id="login-form">
                        <h2>Welcome Back</h2>
                        <p>Please enter your credentials to access your account.</p>
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" 
                                placeholder="Enter your email">
                        </div>
                        <div class="form-group">
                            <label for="password">Password</label>
                            <input type="password" id="password" name="password" 
                                placeholder="Enter your password">
                        </div>
                        <button type="submit" class="login-btn">Login</button>
                    </form>
                    <!-- Dont have an account? -->
                    <p>Don't have an account? <a href="Signup.html">Sign up</a></p>
                </div>
            </div>
        </section>
    </main>
    <div id="feedback-modal" class="modal-overlay">
        <div class="modal-box">
            <div id="modal-icon" class="modal-icon"></div>
            <h3 id="modal-title"></h3>
            <p id="modal-message"></p>
            <button id="modal-close-btn" class="modal-btn">Try Again</button>
        </div>
    </div>
    <script src="bank.js"></script>
    <script src="customer.js"></script>
    <script src="login.js"></script>
</body>

</html>
