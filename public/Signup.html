<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Tinubu Bank</title>
    <link rel="stylesheet" href="signup.css">
    <link rel="stylesheet" href="login-media.css">
   
</head>

<body>
    <main>
        <section class="signup-section">
            <div class="container">
                <div class=" left signup-left">
                    <img src="./images/signup img.png" alt="" class="left-img">
                </div>
                <div class="right signup-right">
                    <form action="" class="signup-form" id="signup-form">
                        <h2>Create an Account</h2>
                        <p>Please fill in the details below to create your account.</p>
                        <div class="form-group">
                            <label for="fullname">Full Name</label>
                            <input type="text" id="fullname" name="fullname" placeholder="Enter your full name">
                        </div>
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" placeholder="Enter your email">
                        </div>
                        <div class="form-group">
                            <label for="phone">Phone Number</label>
                            <input type="tel" id="phone" name="phone" placeholder="Enter your phone number">
                        </div>
                        <div class="form-group">
                            <label for="password">Password</label>
                            <input type="password" id="password" name="password" placeholder="Enter your password">
                        </div>
                        <div class="form-group">
                            <label for="confirm-password">Confirm Password</label>
                            <input type="password" id="confirm-password" name="confirm-password"
                                placeholder="Confirm your password">
                        </div>
                        <button type="submit" class="signup-btn">Sign Up</button>
                    </form>
                    <!-- Already have an account? -->
                    <p>Already have an account? <a href="Login.html">Login</a></p>
                </div>

            </div>
        </section>
    </main>
    <div id="feedback-modal" class="modal-overlay">
        <div class="modal-box">
            <div id="modal-icon" class="modal-icon"></div>

            <h3 id="modal-title"></h3>
            <p id="modal-message"></p>

            <button id="modal-close-btn" class="modal-btn">Try Again</button>
        </div>
    </div>
    <script src="bank.js"></script>
    <script src="customer.js"></script>
    <script src="signup.js"></script>
</body>

</html>
